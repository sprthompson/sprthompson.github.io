<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Truenorth — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// Paste your deployed Apps Script Web App URL here (ends in /exec).
// See apps-script-backend.gs for the code to deploy and step-by-step setup.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGkdTQ81aYSIhbg_WV2Us_wrzmx5n8EQWqJfqGPDYlM9GzEqHZjnZxvhjr4OdgiBh-ZA/exec";

const STORAGE_KEY_IDENTITY = "tn_identity_v1";
const STORAGE_KEY_MARKS = "tn_marks_v1";

const tokens = {
  canvas: "#F6F1E7",
  ink: "#20302E",
  inkSoft: "#5B6664",
  trust: "#0E6E5B",
  love: "#C24A3B",
  maybe: "#C68A2E",
  pass: "#5B6B6E",
  line: "#E4DCC9",
  warn: "#B5532E",
};

const listings = [
  { id: 1, name: "Casa Alma", location: "Lisbon, Portugal", price: 142, nights: 3, rating: 4.8, proof: "Matches Booking.com, beats Expedia by £7", gradient: ["#E8B796", "#C24A3B"], glyph: "☀" },
  { id: 2, name: "Caldera View Suites", location: "Santorini, Greece", price: 268, nights: 3, rating: 4.9, proof: "Lowest of 42 sites checked", gradient: ["#8FB9C9", "#1F4959"], glyph: "≈" },
  { id: 3, name: "Ryokan Kawa", location: "Kyoto, Japan", price: 196, nights: 3, rating: 4.7, proof: "Same price everywhere, only here", gradient: ["#9CAF88", "#3C4A33"], glyph: "❀" },
  { id: 4, name: "Table Bay Lodge", location: "Cape Town, South Africa", price: 179, nights: 3, rating: 4.6, proof: "£12 cheaper than Hotels.com", gradient: ["#D9A45B", "#5B3A29"], glyph: "▲" },
  { id: 5, name: "Arenal Treehouse", location: "La Fortuna, Costa Rica", price: 158, nights: 3, rating: 4.9, proof: "Exclusive rate, not listed elsewhere", gradient: ["#7E9B6B", "#2E3D26"], glyph: "♣" },
  { id: 6, name: "Northern Lights Lodge", location: "Reykjavik, Iceland", price: 211, nights: 3, rating: 4.5, proof: "Matches Booking.com", gradient: ["#A9C4D8", "#27343F"], glyph: "❄" },
];

const proofRows = [
  { name: "Truenorth", price: 142, mine: true },
  { name: "Booking.com", price: 142 },
  { name: "Expedia", price: 149 },
  { name: "Hotels.com", price: 151 },
  { name: "Direct hotel site", price: 145 },
];

const verdictMeta = {
  love: { label: "Love", colour: tokens.love, glyph: "♥", prompt: "What made you love this one?" },
  maybe: { label: "Maybe", colour: tokens.maybe, glyph: "?", prompt: "What's making you unsure?" },
  pass: { label: "Pass", colour: tokens.pass, glyph: "✕", prompt: "What ruled this one out?" },
};

const FIRST_NAMES = ["Priya", "Sam", "Jordan", "Maya", "Theo", "Nadia", "Owen", "Elena", "Marcus", "Ivy", "Felix", "Rosa", "Kenji", "Aaliyah", "Lucas", "Sofia"];
const LAST_NAMES = ["Shah", "Ortiz", "Lindqvist", "Khan", "Reyes", "Park", "Novak", "Brandt", "Silva", "Ferreira", "Adeyemi", "Tanaka", "Moreau", "Walsh"];

function randomIdentity() {
  const f = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
  const l = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
  return { name: `${f} ${l}`, initials: `${f[0]}${l[0]}`.toUpperCase() };
}

function randomCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function loadIdentity() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_IDENTITY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const id = randomIdentity();
  try { localStorage.setItem(STORAGE_KEY_IDENTITY, JSON.stringify(id)); } catch (e) {}
  return id;
}

function loadMyMarks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_MARKS);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {};
}

function saveMyMarks(marks) {
  try { localStorage.setItem(STORAGE_KEY_MARKS, JSON.stringify(marks)); } catch (e) {}
}

function VerdictButton({ kind, active, onClick }) {
  const { label, colour, glyph } = verdictMeta[kind];
  return (
    <button
      onClick={onClick}
      className="flex-1 flex flex-col items-center gap-1 py-2 rounded-xl border-2 transition"
      style={{
        borderColor: active ? colour : tokens.line,
        backgroundColor: active ? `${colour}1A` : "transparent",
        color: active ? colour : tokens.inkSoft,
      }}
    >
      <span style={{ fontSize: 18, lineHeight: 1 }}>{glyph}</span>
      <span className="text-xs font-semibold">{label}</span>
    </button>
  );
}

function Postcard({ listing, size }) {
  const dims = size === "small" ? "w-14 h-14 rounded-lg" : "h-32 rounded-t-2xl";
  const fontSize = size === "small" ? 22 : 36;
  return (
    <div
      className={`${dims} flex items-center justify-center shrink-0`}
      style={{ backgroundImage: `linear-gradient(135deg, ${listing.gradient[0]}, ${listing.gradient[1]})` }}
    >
      <span style={{ fontSize, color: "#fff" }}>{listing.glyph}</span>
    </div>
  );
}

function NoteBox({ kind, note, onEdit }) {
  const { colour, glyph } = verdictMeta[kind];
  return (
    <button
      onClick={onEdit}
      className="w-full text-left mt-3 p-3 rounded-xl flex gap-2 items-start"
      style={{ backgroundColor: `${colour}14`, border: `1px solid ${colour}40` }}
    >
      <span style={{ color: colour, fontSize: 14, lineHeight: "20px" }}>{glyph}</span>
      <span className="text-sm flex-1" style={{ color: tokens.ink }}>{note}</span>
      <span style={{ color: tokens.inkSoft, fontSize: 13 }}>✎</span>
    </button>
  );
}

function OthersRow({ entries }) {
  if (!entries.length) return null;
  const shown = entries.slice(0, 4);
  const extra = entries.length - shown.length;
  return (
    <div className="flex items-center gap-1 mt-2">
      {shown.map((e) => {
        const colour = (verdictMeta[e.verdict] || {}).colour || tokens.inkSoft;
        const titleText = `${e.name}: ${(verdictMeta[e.verdict] || {}).label || ""}${e.note ? ` — "${e.note}"` : ""}`;
        return (
          <div
            key={e.initials}
            title={titleText}
            className="w-6 h-6 rounded-full flex items-center justify-center font-semibold text-white shrink-0"
            style={{ backgroundColor: colour, fontSize: "10px" }}
          >
            {e.initials}
          </div>
        );
      })}
      {extra > 0 && <span className="text-xs" style={{ color: tokens.inkSoft }}>+{extra}</span>}
    </div>
  );
}

function ConnectionBanner({ status }) {
  if (status === "unconfigured") {
    return (
      <div className="px-6 py-2.5 border-b flex items-center gap-2 text-xs" style={{ borderColor: tokens.line, backgroundColor: `${tokens.warn}10`, color: tokens.warn }}>
        ⚠ Not connected — paste your Apps Script URL into APPS_SCRIPT_URL. Your own marks still save to this browser either way.
      </div>
    );
  }
  if (status === "error") {
    return (
      <div className="px-6 py-2.5 border-b flex items-center gap-2 text-xs" style={{ borderColor: tokens.line, backgroundColor: `${tokens.warn}10`, color: tokens.warn }}>
        ⚠ Couldn't reach the shared sheet — your own marks still save to this browser, you just won't see other people's.
      </div>
    );
  }
  if (status === "connected") {
    return (
      <div className="px-6 py-1.5 border-b flex items-center gap-2 text-xs" style={{ borderColor: tokens.line, backgroundColor: "#FFFFFF", color: tokens.trust }}>
        ● Connected — your marks are saved to this browser and shared with others viewing this page
      </div>
    );
  }
  return null;
}

function App() {
  const me = useRef(loadIdentity()).current;
  const tripCode = useRef(randomCode()).current;

  const [myMarks, setMyMarks] = useState(loadMyMarks()); // { [listingId]: {verdict, note} }
  const [othersBoard, setOthersBoard] = useState({}); // { [listingId]: { [initials]: {...} } }
  const [connection, setConnection] = useState(APPS_SCRIPT_URL ? "loading" : "unconfigured");
  const [modal, setModal] = useState(null);
  const [draft, setDraft] = useState("");
  const [showProof, setShowProof] = useState(false);
  const [signedUp, setSignedUp] = useState(false);
  const [shared, setShared] = useState(false);

  const loadBoard = async () => {
    if (!APPS_SCRIPT_URL) return;
    try {
      const res = await fetch(APPS_SCRIPT_URL, { method: "GET" });
      const data = await res.json();
      const next = {};
      for (const m of data) {
        if (m.initials === me.initials) continue; // mine comes from localStorage, not the poll
        const listingId = Number(m.listingId);
        next[listingId] = { ...(next[listingId] || {}), [m.initials]: { name: m.name, initials: m.initials, verdict: m.verdict, note: m.note || undefined } };
      }
      setOthersBoard(next);
      setConnection("connected");
    } catch (err) {
      console.error("Could not reach Apps Script backend", err);
      setConnection("error");
    }
  };

  useEffect(() => {
    loadBoard();
    const interval = setInterval(loadBoard, 6000);
    return () => clearInterval(interval);
  }, []);

  const syncMark = async (listingId, verdict, note) => {
    if (!APPS_SCRIPT_URL) return;
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "set", listingId, initials: me.initials, name: me.name, verdict, note: note || "" }),
      });
      setConnection("connected");
    } catch (err) {
      console.error("Could not sync mark", err);
      setConnection("error");
    }
  };

  const syncDelete = async (listingId) => {
    if (!APPS_SCRIPT_URL) return;
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", listingId, initials: me.initials }),
      });
    } catch (err) {
      console.error("Could not sync removal", err);
    }
  };

  const setMark = (listingId, verdict, note) => {
    setMyMarks((prev) => {
      const next = { ...prev, [listingId]: { verdict, note } };
      saveMyMarks(next);
      return next;
    });
    syncMark(listingId, verdict, note);
  };

  const clearMark = (listingId) => {
    setMyMarks((prev) => {
      const next = { ...prev };
      delete next[listingId];
      saveMyMarks(next);
      return next;
    });
    syncDelete(listingId);
  };

  const openModal = (id, kind) => {
    const existingNote = (myMarks[id] && myMarks[id].note) || "";
    setMark(id, kind, existingNote);
    setDraft(existingNote);
    setModal({ id, kind });
  };

  const toggleVerdict = (id, kind) => {
    if (myMarks[id] && myMarks[id].verdict === kind) {
      clearMark(id);
    } else {
      openModal(id, kind);
    }
  };

  const saveNote = () => {
    const verdict = myMarks[modal.id] && myMarks[modal.id].verdict;
    setMark(modal.id, verdict, draft.trim() || undefined);
    setModal(null);
  };

  const removeVerdict = () => {
    clearMark(modal.id);
    setModal(null);
  };

  const hasMarkedAnything = listings.some((l) => myMarks[l.id]);

  return (
    <div style={{ backgroundColor: tokens.canvas, color: tokens.ink, minHeight: "100vh" }}>
      <header className="flex items-center justify-between px-6 py-4 border-b" style={{ borderColor: tokens.line }}>
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-full flex items-center justify-center" style={{ backgroundColor: tokens.trust }}>
            <span style={{ color: "#fff", fontSize: 13 }}>≈</span>
          </div>
          <span className="font-display text-xl font-semibold">Truenorth</span>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-xs flex items-center gap-1" style={{ color: tokens.inkSoft }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: tokens.trust }} />
            Browsing as {me.name} ({me.initials})
          </span>
          <span className="text-xs px-2 py-1 rounded-full" style={{ backgroundColor: tokens.ink + "0D", color: tokens.inkSoft }}>
            Prototype — internal concept
          </span>
        </div>
      </header>

      <ConnectionBanner status={connection} />

      <div className="px-6 py-3 border-b" style={{ borderColor: tokens.line, backgroundColor: "#FFFFFF" }}>
        <button onClick={() => setShowProof((s) => !s)} className="w-full flex items-center justify-between text-left">
          <p className="text-sm" style={{ color: tokens.inkSoft }}>
            <span style={{ color: tokens.trust, fontWeight: 600 }}>✓ Checked against 42 partner sites.</span>{" "}
            Every price below is the lowest you'll find, every time.
          </p>
          <span style={{ transform: showProof ? "rotate(180deg)" : "none", transition: "transform 0.2s", color: tokens.inkSoft }}>⌄</span>
        </button>
        {showProof && (
          <div className="mt-3 max-w-sm">
            <p className="text-xs mb-2" style={{ color: tokens.inkSoft }}>Casa Alma, 3 nights — how we compare</p>
            <div className="rounded-xl border overflow-hidden" style={{ borderColor: tokens.line }}>
              {proofRows.map((row) => (
                <div
                  key={row.name}
                  className="flex items-center justify-between px-3 py-2 text-sm"
                  style={{ backgroundColor: row.mine ? `${tokens.trust}14` : "transparent", borderTop: row.mine ? "none" : `1px solid ${tokens.line}` }}
                >
                  <span className={row.mine ? "font-semibold" : ""} style={{ color: row.mine ? tokens.trust : tokens.ink }}>{row.name}</span>
                  <span className="font-mono text-sm">£{row.price}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {hasMarkedAnything && (
        <div className="px-6 py-2.5 border-b flex items-center gap-2" style={{ borderColor: tokens.line, backgroundColor: "#FFFFFF" }}>
          <button
            onClick={() => setSignedUp(true)}
            disabled={signedUp}
            className="text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1"
            style={{ backgroundColor: signedUp ? `${tokens.trust}14` : tokens.trust, color: signedUp ? tokens.trust : "#fff", cursor: signedUp ? "default" : "pointer" }}
          >
            {signedUp ? "✓ Signed up" : "Sign up to save notes"}
          </button>
          <button
            onClick={() => signedUp && setShared(true)}
            disabled={!signedUp}
            title={signedUp ? "" : "Sign up to share notes"}
            className="text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1"
            style={{
              backgroundColor: signedUp ? (shared ? `${tokens.trust}14` : "#fff") : tokens.canvas,
              color: signedUp ? tokens.trust : tokens.inkSoft,
              border: `1px solid ${signedUp ? tokens.trust : tokens.line}`,
              cursor: signedUp ? "pointer" : "not-allowed",
              opacity: signedUp ? 1 : 0.6,
            }}
          >
            {shared ? "✓ Shared" : "Share these notes"}
          </button>
          {shared && <span className="text-xs font-mono" style={{ color: tokens.inkSoft }}>truenorth.com/t/{tripCode}</span>}
        </div>
      )}

      <main className="px-6 py-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-start">
        {listings.map((listing) => {
          const mine = myMarks[listing.id];
          const verdict = mine && mine.verdict;
          const note = mine && mine.note;
          const others = Object.values(othersBoard[listing.id] || {});

          if (verdict === "pass") {
            return (
              <button
                key={listing.id}
                onClick={() => openModal(listing.id, "pass")}
                className="w-full flex items-center gap-3 p-2 rounded-xl border text-left"
                style={{ borderColor: tokens.line, opacity: 0.55, filter: "grayscale(0.6)" }}
              >
                <Postcard listing={listing} size="small" />
                <div className="min-w-0">
                  <p className="text-sm font-medium truncate">{listing.name}</p>
                  {note && <p className="text-xs italic truncate" style={{ color: tokens.inkSoft }}>"{note}"</p>}
                </div>
              </button>
            );
          }

          return (
            <div key={listing.id} className="rounded-2xl border bg-white overflow-hidden" style={{ borderColor: tokens.line }}>
              <Postcard listing={listing} />
              <div className="p-4">
                <p className="font-display text-lg font-semibold leading-tight">{listing.name}</p>
                <p className="text-sm" style={{ color: tokens.inkSoft }}>{listing.location}</p>
                <div className="flex items-baseline gap-1 mt-2">
                  <span className="font-mono text-lg font-semibold">£{listing.price}</span>
                  <span className="text-xs" style={{ color: tokens.inkSoft }}>/ {listing.nights} nights</span>
                </div>
                <p className="text-xs mt-1" style={{ color: tokens.trust }}>✓ {listing.proof}</p>

                <OthersRow entries={others} />

                <div className="flex gap-2 mt-3">
                  {["love", "maybe", "pass"].map((k) => (
                    <VerdictButton key={k} kind={k} active={verdict === k} onClick={() => toggleVerdict(listing.id, k)} />
                  ))}
                </div>

                {(verdict === "love" || verdict === "maybe") && note && (
                  <NoteBox kind={verdict} note={note} onEdit={() => openModal(listing.id, verdict)} />
                )}
              </div>
            </div>
          );
        })}
      </main>

      {modal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ backgroundColor: "rgba(32,48,46,0.45)" }} onClick={() => setModal(null)}>
          <div className="w-full max-w-sm bg-white rounded-2xl p-5" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ backgroundColor: `${verdictMeta[modal.kind].colour}1A` }}>
                  <span style={{ color: verdictMeta[modal.kind].colour, fontSize: 15 }}>{verdictMeta[modal.kind].glyph}</span>
                </div>
                <span className="font-display text-lg font-semibold" style={{ color: verdictMeta[modal.kind].colour }}>Why {verdictMeta[modal.kind].label}?</span>
              </div>
              <button onClick={() => setModal(null)} style={{ color: tokens.inkSoft }}>✕</button>
            </div>

            <textarea
              autoFocus
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              placeholder={verdictMeta[modal.kind].prompt}
              className="w-full text-sm rounded-xl border p-3 resize-none"
              style={{ borderColor: tokens.line }}
              rows={3}
            />

            <div className="flex items-center justify-between mt-4">
              <button onClick={removeVerdict} className="flex items-center gap-1 text-xs" style={{ color: tokens.inkSoft }}>
                ↺ Remove {verdictMeta[modal.kind].label.toLowerCase()}
              </button>
              <div className="flex gap-2">
                <button onClick={() => setModal(null)} className="text-sm px-3 py-1.5 rounded-full" style={{ color: tokens.inkSoft }}>Skip</button>
                <button onClick={saveNote} className="text-sm px-4 py-1.5 rounded-full font-semibold text-white" style={{ backgroundColor: verdictMeta[modal.kind].colour }}>Save note</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
